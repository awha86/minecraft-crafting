<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hvad kan jeg lave?</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a7d2c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #2b2b2b; color: #fff; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px;
           padding: 10px 14px; background: #3a7d2c; border-bottom: 4px solid #24521b; }
  header button { font-size: 28px; width: 56px; height: 56px; border: 0; border-radius: 10px;
                  background: #24521b; color: #fff; }
  header .flag { background: transparent; font-size: 34px; opacity: .45; }
  header .flag.on { opacity: 1; background: #24521b; }
  header h1 { margin: 0; font-size: 24px; flex: 1; }
  main { padding: 14px; max-width: 1100px; margin: 0 auto; }
  h2 { font-size: 22px; margin: 22px 0 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  .tile { background: #8b8b8b; border: 4px solid; border-color: #c6c6c6 #555 #555 #c6c6c6;
          border-radius: 6px; padding: 10px 6px; text-align: center; color: #fff; text-decoration: none;
          font-size: 15px; font-weight: 600; text-shadow: 1px 1px #333; }
  .tile:active { transform: scale(.95); }
  .tile .ic { width: 64px; height: 64px; margin: 0 auto 6px; }
  .tiles.small { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .tiles.small .ic { width: 44px; height: 44px; }
  .tiles.small .tile { font-size: 12px; padding: 6px 4px; }
  .ic { display: flex; align-items: center; justify-content: center; }
  .ic img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; }
  .ic .txt { font-size: 11px; line-height: 1.1; background: #555; border-radius: 4px; padding: 3px;
             width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .hero { display: flex; align-items: center; gap: 16px; }
  .hero .ic { width: 96px; height: 96px; }
  .hero .name { font-size: 30px; font-weight: 700; }
  .hero a { color: #9fd3ff; font-size: 15px; }
  .recipes { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .recipe { background: #c6c6c6; color: #333; border-radius: 6px; padding: 10px; }
  .recipe .title { font-weight: 700; font-size: 18px; margin-bottom: 8px; }
  .craft { display: flex; align-items: center; gap: 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, 58px); gap: 3px; }
  .slot { width: 58px; height: 58px; background: #8b8b8b; border: 3px solid; border-color: #373737 #fff #fff #373737;
          padding: 4px; display: block; color: #fff; text-decoration: none; }
  .slot .txt { font-size: 9px; }
  .slot .ic { width: 100%; height: 100%; }
  .slot.hl { background: #6fbf5a; }
  .arrow { font-size: 34px; color: #555; }
  .slot.big { width: 74px; height: 74px; position: relative; }
  .count { position: absolute; right: 4px; bottom: 0; font-weight: 800; font-size: 18px; color: #fff; text-shadow: 2px 2px #333; }
  .empty { opacity: .8; font-size: 18px; }
</style>
</head>
<body>
<header>
  <button id="back" aria-label="Tilbage">⬅</button>
  <h1 id="title">Hvad kan jeg lave?</h1>
  <button class="flag" data-l="da" aria-label="Dansk">🇩🇰</button>
  <button class="flag" data-l="en" aria-label="English">🇬🇧</button>
  <button id="home" aria-label="Forside">🏠</button>
</header>
<main id="app"></main>
<script src="data.js?v=4"></script>
<script>
const FEATURED = ['diamond','iron_ingot','gold_ingot','emerald','copper_ingot','netherite_ingot',
  'oak_log','oak_planks','stick','cobblestone','coal','redstone','string','leather','white_wool',
  'glass','paper','feather','flint','lapis_lazuli','quartz','slime_ball','bone_meal','sugar_cane'];
const app = document.getElementById('app');
const TXT = {
  da: { title: 'Hvad kan jeg lave?', tap: 'Tryk på en ting', all: 'Alle ting', uses: 'Det kan du lave med den',
        makes: 'Sådan laver du den', nouse: 'Den kan ikke bruges til at crafte noget.',
        nomake: 'Den kan ikke craftes – den skal findes, graves eller smeltes.',
        wood: 'Alle slags træ virker – opskrifterne viser bare eg.' },
  en: { title: 'What can I make?', tap: 'Tap a thing', all: 'All things', uses: 'What you can make with it',
        makes: 'How to make it', nouse: 'It can\'t be used for crafting.',
        nomake: 'It can\'t be crafted – find it, mine it or smelt it.',
        wood: 'Any kind of wood works – the recipes just show oak.' } };
let LANG = 'da';
try { if (localStorage.getItem('lang') === 'en') LANG = 'en'; } catch (e) {}
const t = k => TXT[LANG][k];
const nm = n => MC.items[n][LANG];
function setLang(l) {
  LANG = l; document.documentElement.lang = l;
  try { localStorage.setItem('lang', l); } catch (e) {}
  document.querySelectorAll('.flag').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  route();
}
document.querySelectorAll('.flag').forEach(b => b.onclick = () => setLang(b.dataset.l));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Billeder ligger på siden selv (tex/); ting uden billede vises med navnet
function icon(name) {
  const it = MC.items[name];
  if (!it.t) return `<span class="ic"><span class="txt">${esc(nm(name))}</span></span>`;
  return `<span class="ic"><img loading="lazy" alt="${esc(nm(name))}" src="tex/${it.t}.png"
    data-t="${esc(nm(name))}" onerror="this.outerHTML='<span class=txt>'+esc(this.dataset.t)+'</span>'"></span>`;
}
const tile = n => `<a class="tile" href="#/i/${n}">${icon(n)}${esc(nm(n))}</a>`;

function recipeCard(i, hl) {
  const [res, count, grid] = MC.recipes[i];
  const cells = grid.map(g => g
    ? `<a class="slot${g === hl ? ' hl' : ''}" href="#/i/${g}">${icon(g)}</a>`
    : `<span class="slot"></span>`).join('');
  return `<div class="recipe"><div class="title">${esc(nm(res))}</div>
    <div class="craft"><div class="grid">${cells}</div><span class="arrow">➜</span>
    <a class="slot big" href="#/i/${res}">${icon(res)}${count > 1 ? `<span class="count">${count}</span>` : ''}</a></div></div>`;
}

function home() {
  document.getElementById('title').textContent = t('title');
  const all = Object.keys(MC.uses).filter(n => !/^stripped_/.test(n)).sort((a, b) => nm(a).localeCompare(nm(b), LANG));
  app.innerHTML = `<h2>${t('tap')}</h2><div class="tiles">${FEATURED.filter(n => MC.items[n]).map(tile).join('')}</div>
    <h2>${t('all')}</h2><div class="tiles small">${all.map(tile).join('')}</div>`;
}

function item(name) {
  const it = MC.items[name];
  if (!it) return home();
  document.getElementById('title').textContent = nm(name);
  const uses = (MC.uses[name] || []).slice().sort((a, b) =>
    /smithing_template/.test(MC.recipes[a][0]) - /smithing_template/.test(MC.recipes[b][0]));
  const makes = MC.makes[name] || [];
  app.innerHTML = `<div class="hero">${icon(name)}<div><div class="name">${esc(nm(name))}</div></div></div>
    ${/_(planks|log|slab|stem)$/.test(name) ? `<p class="empty">💡 ${t('wood')}</p>` : ''}
    <h2>⛏️ ${t('uses')}</h2>
    ${uses.length ? `<div class="recipes">${uses.map(i => recipeCard(i, name)).join('')}</div>` : `<p class="empty">${t('nouse')}</p>`}
    <h2>🛠️ ${t('makes')}</h2>
    ${makes.length ? `<div class="recipes">${makes.map(i => recipeCard(i)).join('')}</div>` : `<p class="empty">${t('nomake')}</p>`}`;
}

function route() {
  const m = location.hash.match(/^#\/i\/(.+)$/);
  m ? item(decodeURIComponent(m[1])) : home();
  scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
document.getElementById('back').onclick = () => history.length > 1 ? history.back() : (location.hash = '');
document.getElementById('home').onclick = () => { location.hash = ''; };
setLang(LANG);
if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update());
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) location.reload(); });
}
</script>
</body>
</html>
